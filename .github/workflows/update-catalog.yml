name: Update catalog

# Manual only. The owner chose not to use an API key (Nov 14 2026), so the check runs in Claude Code
# instead (`python -m job.manual`, see README). To make it automatic again: add the ANTHROPIC_API_KEY
# secret and put back `schedule: - cron: "0 10 * * 1"` (Mondays 10:00 UTC).
on:
  workflow_dispatch:        # the "Run workflow" button (needs the ANTHROPIC_API_KEY secret)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the API key is there
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=ANTHROPIC_API_KEY is missing::Add it under Settings > Secrets and variables > Actions > New repository secret (name: ANTHROPIC_API_KEY). Steps are in README.md."
            echo "### The catalog was not checked" >> "$GITHUB_STEP_SUMMARY"
            echo "The secret **ANTHROPIC_API_KEY** is missing. Add it under Settings > Secrets and variables > Actions > New repository secret, then press Run workflow again. Steps are in README.md." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: job/requirements.txt

      - name: Install
        run: |
          pip install -r job/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tests must pass before anything is published
        run: |
          python -m pytest -q
          python -m job.validate catalog.json

      - name: Read the issuer pages and build the new catalog
        run: python -m job.update

      - name: Check the new catalog against the schema
        run: python -m job.validate catalog.json

      - name: Publish (safe changes to main, big changes as a pull request)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m job.publish
