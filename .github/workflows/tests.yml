name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - name: Install
        run: pip install -r job/requirements.txt
      - name: Run the tests
        run: python -m pytest -q
      - name: Check catalog.json against the schema
        run: python -m job.validate catalog.json
